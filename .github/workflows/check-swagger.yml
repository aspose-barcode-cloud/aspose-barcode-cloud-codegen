name: Check swagger

# Compares spec/aspose-barcode-cloud.json with the live API specification.
# Kept apart from "Check submodules" so a stale specification does not turn
# that workflow red.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-swagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check existing swagger specification is up-to-date
        run: curl https://api.aspose.cloud/v4.0/barcode/swagger/spec | diff --strip-trailing-cr -y --suppress-common-lines spec/aspose-barcode-cloud.json -
