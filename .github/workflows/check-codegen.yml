name: Check submodules

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-codegen-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test documentation generation helpers
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash -n codegen/generate-swift.bash

  check-submodules:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # All submodules are public, so `git submodule update --remote`
          # below does not need the job token.
          persist-credentials: false

      - name: Check all submodules up-to-date
        run: |
          git submodule update --recursive --remote
          git diff --exit-code
